name: Documentation (GitHub Pages)

# Builds the documentation site and deploys it to GitHub Pages: the landing page `index.html`,
# the blueprint (web version with dependency graph, and PDF), the formalization summary and the
# doc-gen4 API documentation (all of it, including Mathlib, so that every link matches the pinned
# Mathlib version). The site has the layout of the repository, except that the API docs are
# served from `api/` instead of `docbuild/.lake/build/doc/`; links are rewritten accordingly.
#
# Runs on pushes to `main` (in the public repository `main` moves only with a release) and by
# hand. Only in the public repository: the private working copy has no Pages site. Not on tags:
# GitHub's Actions cache is scoped by ref, and a cache written on one tag cannot be read on the
# next one, while caches written on `main` can.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pdf:
    if: github.repository == 'JulianHolstein/cohesivemodules'
    runs-on: ubuntu-latest
    # Full TeX Live 2023, as used for the local builds; `print.tex` loads its fonts by file name
    # from TeX Live (stix2-otf, dejavu, gnu-freefont).
    container: texlive/texlive:TL2023-historic
    steps:
      - uses: actions/checkout@v4
      - name: Blueprint PDF (what `leanblueprint pdf` runs)
        working-directory: blueprint/src
        run: |
          mkdir -p ../print
          latexmk -output-directory=../print
      - uses: actions/upload-artifact@v4
        with:
          name: blueprint-pdf
          path: blueprint/print/print.pdf
          if-no-files-found: error

  site:
    if: github.repository == 'JulianHolstein/cohesivemodules'
    needs: pdf
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # doc-gen4 runs one docInfo job per core, each with the Mathlib environment loaded; on the
      # 16 GB runner, spawning `git` for the source links then failed with "not enough memory"
      # (v1.0-1, run 44086539129). Swap and overcommit avoid that.
      - name: Add swap
        run: |
          sudo fallocate -l 32G /swapfile-docs
          sudo chmod 600 /swapfile-docs
          sudo mkswap /swapfile-docs
          sudo swapon /swapfile-docs
          sudo sysctl -w vm.overcommit_memory=1
          free -h

      - uses: actions/checkout@v4

      # Build outputs of the previous run: the project's oleans, doc-gen4 and its own packages,
      # and the generated docs (docInfo per module and HTML). Lake checks traces, so only modules
      # that changed (and the pages that depend on them) are rebuilt. The key changes with every
      # commit; the newest cache with the same toolchain and manifests is restored. Without a hit
      # the run builds everything (about 1 h).
      - name: Restore build and docs cache
        uses: actions/cache@v4
        with:
          path: |
            .lake/build
            .lake/packages/doc-gen4
            .lake/packages/leansqlite
            .lake/packages/UnicodeBasic
            .lake/packages/BibtexQuery
            .lake/packages/MD4Lean
            docbuild/.lake
          key: docs-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'docbuild/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            docs-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'docbuild/lake-manifest.json') }}-

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build the library
        run: |
          lake exe cache get
          lake build

      - name: API documentation (doc-gen4; about 35 min without cache)
        working-directory: docbuild
        run: lake build Cohesivemodules:docs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install leanblueprint (versions of the local build)
        run: |
          sudo apt-get update
          # texlive-base for `kpsewhich`: plasTeX finds `\input` files only through it (without
          # it the v1.0-2 site had a blueprint with no chapters).
          sudo apt-get install -y graphviz libgraphviz-dev texlive-base
          pip install leanblueprint==0.0.20 plasTeX==3.1 plastexdepgraph==0.0.5 \
            plastexshowmore==0.0.2

      - name: Blueprint web version
        run: |
          leanblueprint web
          for c in intro A S C F Z2 Z3 Z4 Z5; do
            test -f "blueprint/web/chap-$c.html" || { echo "missing chapter $c"; exit 1; }
          done

      - uses: actions/download-artifact@v4
        with:
          name: blueprint-pdf
          path: blueprint/print

      - name: Assemble the site
        run: |
          mkdir -p _site/blueprint _site/docs
          cp index.html _site/
          cp -R blueprint/web _site/blueprint/web
          cp -R blueprint/print _site/blueprint/print
          cp docs/formalization-summary.pdf _site/docs/
          cp -R docbuild/.lake/build/doc _site/api
          sed -i 's|docbuild/\.lake/build/doc/|api/|g' _site/index.html
          find _site/blueprint/web -name '*.html' -print0 \
            | xargs -0 sed -i 's|\.\./\.\./docbuild/\.lake/build/doc/|../../api/|g'
          if grep -rl 'docbuild/' _site/index.html _site/blueprint/web; then
            echo "unrewritten links to docbuild/"; exit 1
          fi
          n=$(cat _site/blueprint/web/*.html | grep -o '\.\./\.\./api/' | wc -l)
          echo "blueprint links into the API docs: $n"
          test "$n" -gt 100 || { echo "too few blueprint links into the API docs"; exit 1; }
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.repository == 'JulianHolstein/cohesivemodules'
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
